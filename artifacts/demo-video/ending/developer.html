<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#21182c;color:#f6efff;font-family:Arial}.wrap{padding:90px 100px}h1{font-size:54px;line-height:1.2;margin:0 0 24px}h2,p{font-size:34px;line-height:1.45;margin:0}.sub{color:#cbb9d9}.flow{display:flex;align-items:stretch;gap:30px;margin-top:125px}.card{flex:1;min-width:0;border:2px solid #755d87;border-radius:24px;background:#30243c;padding:38px;display:flex;flex-direction:column;justify-content:center;min-height:260px}.card h2{color:#c7f76c;margin-bottom:24px}.arrow{font-size:54px;align-self:center;color:#c7f76c}.foot{position:absolute;left:100px;right:100px;bottom:110px;padding:35px;border-left:5px solid #c7f76c;background:#30243c;font-size:34px;line-height:1.45}.active{border-color:#c7f76c}.blue{border:3px solid #8bbaff;background:#27243e;border-radius:28px;padding:50px;margin-top:100px}.blue h2{color:#a5caff}.center{text-align:center}.center .flow{margin-top:140px}.center .card{min-height:230px}.brand{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:65px}.brand img{width:650px}.brand p{font-size:48px;text-align:center;max-width:1500px}.brand .url{font-size:38px;color:#c7f76c}</style><div class="wrap center"><h1>Turn findings into the next change.</h1><div class="flow"><div class="card" id="one"><h2>Finding</h2><p>See where trust failed</p></div><div class="arrow">→</div><div class="card" id="two"><h2>Fix</h2><p>Choose the right check</p></div><div class="arrow">→</div><div class="card" id="three"><h2>Retest</h2><p>Verify the change</p></div></div></div><script>window.renderFrame=t=>{const a=t<2.5?'one':t<5?'two':'three';for(const id of ['one','two','three'])document.getElementById(id).className='card'+(id===a?' active':'');};window.renderFrame(0);</script>
