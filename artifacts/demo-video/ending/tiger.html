<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#21182c;color:#f6efff;font-family:Arial}.wrap{padding:90px 100px}h1{font-size:54px;line-height:1.2;margin:0 0 24px}h2,p{font-size:34px;line-height:1.45;margin:0}.sub{color:#cbb9d9}.flow{display:flex;align-items:stretch;gap:30px;margin-top:125px}.card{flex:1;min-width:0;border:2px solid #755d87;border-radius:24px;background:#30243c;padding:38px;display:flex;flex-direction:column;justify-content:center;min-height:260px}.card h2{color:#c7f76c;margin-bottom:24px}.arrow{font-size:54px;align-self:center;color:#c7f76c}.foot{position:absolute;left:100px;right:100px;bottom:110px;padding:35px;border-left:5px solid #c7f76c;background:#30243c;font-size:34px;line-height:1.45}.active{border-color:#c7f76c}.blue{border:3px solid #8bbaff;background:#27243e;border-radius:28px;padding:50px;margin-top:100px}.blue h2{color:#a5caff}.center{text-align:center}.center .flow{margin-top:140px}.center .card{min-height:230px}.brand{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:65px}.brand img{width:650px}.brand p{font-size:48px;text-align:center;max-width:1500px}.brand .url{font-size:38px;color:#c7f76c}</style><div class="wrap"><h1>Tiger Data turns tests into a history.</h1><p class="sub">Recorded experiment archive</p><div class="flow" style="margin-top:110px"><div class="card"><h2>64,620 events</h2><p>Call turns, tools and verdicts</p></div><div class="arrow" id="in">→</div><div class="card active"><h2>Tiger Data</h2><p>Hypertable<br>+ hourly summaries</p></div><div class="arrow" id="out">→</div><div class="card" id="versions"><h2>Compare versions</h2><p>Breaches + normal calls</p></div></div><div class="foot" id="questions">Which fixes held? Did an old breach return?</div></div><script>window.renderFrame=t=>{document.getElementById('in').style.opacity=.4+.6*Math.abs(Math.sin(t*2));document.getElementById('out').style.opacity=.4+.6*Math.abs(
