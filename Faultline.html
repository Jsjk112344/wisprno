    for (const key of visible) {
      const group = svg("g", { "data-edge": key });
      group.append(svg("path", { d: edges[key], class: "edge-base", "marker-end": "url(#arrow-grey)" }));
      const count = state.passes[key] ?? 0;
      if (count) {
        const confirmed = key === "tool-record" && state.status !== "breached";
        group.append(svg("path", {
          d: edges[key],
          class: "edge-trail" + (confirmed ? " held-edge" : ""),
          "marker-end": confirmed ? "url(#arrow-mint)" : "url(#arrow-hot)"
        }));
        if (playing && at - (state.recent[key] ?? -99) < 1.5) {
          const particle = svg("circle", { r: 4, class: "particle" });
          particle.append(svg("animateMotion", { dur: "1.1s", repeatCount: "indefinite", path: edges[key] }));
          group.append(particle);
        }
      }
      graph2.append(group);
    }
    const record = state.records.at(-1);
    const tool = state.toolCalls.at(-1);
    const hasBreach = state.findings.length > 0;
    function node(id, x, y, title, subtitle, role, shape, className = "") {
      const group = svg("g", {
        class: `node replay-node ${className}`,
        transform: `translate(${x},${y})`,
        tabindex: 0,
        role: "button",
        "aria-label": `${title}. ${subtitle}. Inspect evidence`,
        "data-node": id
      });
      group.append(svg("title", {}, `${title} \u2014 ${subtitle}`), svg("text", { class: "node-role", y: -66, "text-anchor": "middle" }, role));
      if (id === "caller" || id === "agent") group.append(svg("circle", { class: "halo", r: 58 }), svg("circle", { class: "node-face", r: 48 }));
      else group.append(svg("rect", { class: "node-face", x: -46, y: -42, width: 92, height: 84, rx: 19 }));
      group.append(
        svg("path", { d: nodeIcons[shape], fill: "none", stroke: "currentColor", "stroke-width": 1.5, "stroke-linecap": "round", "stroke-linejoin": "round" }),
        svg("text", { class: "node-title", y: 76, "text-anchor": "middle" }, short(title, 27)),
        svg("text", { class: "node-sub", y: 96, "text-anchor": "middle" }, short(subtitle, 34))
      );
      if (id === "record" && hasBreach) {
        const badge = svg("g", { class: "finding-badge", transform: "translate(34,-42)" });
        badge.append(svg("rect", { x: -21, y: -12, width: 42, height: 24, rx: 8 }), svg("text", { y: 4, "text-anchor": "middle" }, "\xD7 " + state.findings.length));
        group.append(badge);
      }
      graph2.append(group);
    }
    if (r.callerId) node("input", 115, 150, "Caller ID", r.callerId + " \xB7 asserted", "RECORDED INPUT", "file");
    if (hasPlan || hasDtmf) node("plan", 115, 425, hasPlan ? "Tester plan" : "DTMF", hasPlan ? state.plan || "No plan yet" : state.current && r.events.filter((e) => e.at <= at && e.raw.type === "caller.dtmf").at(-1)?.text || "Not received yet", "RECORDED INPUT", "plan");
    node("caller", 320, 295, r.sourceKind === "backend-probe" ? "Tool client" : "Synthetic caller", r.sourceKind === "backend-probe" ? "Direct backend probe" : r.transport === "sip" ? "Baresip \xB7 local SIP" : "Recorded caller turns", r.sourceKind === "backend-probe" ? "PROBE" : "CALLER", "caller", "caller");
    node("agent", 540, 295, r.sourceKind === "backend-probe" ? "Mock backend" : r.target, r.sourceKind === "backend-probe" ? "No model run recorded" : "Own deployed voice agent", "OWN DEPLOYMENT", "agent", "agent");
    if (hasIdentity) node("identity", 540, 115, "Verified identity", state.identity, "BACKEND AUTH STATE", "identity", state.auth?.level === "otp" ? "enforced" : "");
    node("tool", 825, 295, tool?.tool ?? "Observed tools", tool ? tool.proof?.verdict ?? "Tool output captured" : "Waiting for invocation", "TOOL CALL", "tool", record ? hasBreach ? "danger" : "enforced" : "");
    const recordValue = record ? record.source === "artifact" ? "Message JSON \xB7 SHA-256 verified" : short(Object.values(record.after).join(", "), 31) : r.initialRecord ? short(String(r.initialRecord.contact ?? r.initialRecord.payout_account), 31) : "No artifact observed yet";
    node("record", 1100, 295, record?.subject ?? r.initialRecord?.name ?? "Observable output", recordValue, r.tier === "backend-record" ? "BACKEND RECORD" : "FILE ARTIFACT", r.tier === "backend-record" ? "record" : "file", record ? hasBreach ? "danger" : "enforced" : "");
  }
  function paint() {
    const r = run();
    currentState = replayAt(r, at);
    const state = currentState;
    byId("root").dataset.playing = String(playing);
    byId("root").dataset.runId = r.id;
    byId("root").dataset.status = state.status;
    setText("map-detail", `${r.events.filter((e) => e.type === "tool").length} tool events \xB7 ${r.tier === "backend-record" ? "backend records" : "file artifacts"}`);
    const status = byId("map-status");
    status.textContent = statusNames[state.status];
    status.className = "map-status result-" + state.status;
    setText("turns", String(state.callerTurns).padStart(2, "0"));
    setText("calls", String(state.toolCalls.length).padStart(2, "0"));
    setText("effects", String(state.records.length).padStart(2, "0"));
    setText("findings", String(state.findings.length).padStart(2, "0"));
    setText("speaker-name", state.speaker === "red" ? "RECORDED CALLER" : state.speaker === "agent" ? "RECORDED AGENT" : r.sourceKind === "backend-probe" ? "RECORDED TOOL PROBE" : "RECORDING");
    setText("caption", state.caption || (r.sourceKind === "backend-probe" ? "No caller dialogue was recorded. Follow the backend tool events." : "Replay the recorded call and follow the observed access."));
    byId("speaker-icon").className = "speaker-avatar" + (state.speaker === "agent" ? " agent" : "");
    byId("speaker-icon").innerHTML = icon(state.speaker ? "phone" : "file");
    const captionTime = state.captionAt ?? state.current?.recordedAt;
    setText("source-time", captionTime ? `${new Date(captionTime).toISOString().slice(11, 23)} UTC` : "");
    const lastRecord = state.records.at(-1);
    setText("note-label", state.plan ? "RECORDED PLAN" : lastRecord ? "EVIDENCE" : "RECORDING");
    setText("note", state.plan || lastRecord?.proof?.explanation || r.warnings[0] || "Only events from the selected recording are replayed.");
    const proof = byId("proof-button");
    proof.disabled = !state.records.length;
    setText("replay-time", `${formatTime(at)} / ${formatTime(r.duration)}`);
    byId("replay-position").value = String(at);
    setText("speed", `${speed}\xD7`);
    byId("play-toggle").innerHTML = icon(playing ? "pause" : "play");
    byId("play-toggle").setAttribute("aria-label", playing ? "Pause replay" : "Play replay");
    byId("main-play").innerHTML = icon(playing ? "pause" : "play") + `<span>${playing ? "Pause replay" : at >= r.duration ? "Replay recording" : "Play recorded run"}</span>`;
    graph(state);
  }
  function detail(title, value, content = byId("drawer-content")) {
    const section = element("section", "proof-section");
    section.append(element("h3", "eyebrow", title));
    const pre = element("pre", "proof-value", typeof value === "string" ? value : json(value));
    section.append(pre);
    content.append(section);
  }
  function openDrawer(mode) {
    drawerMode = mode;
    const r = run();
    const content = byId("drawer-content");
    content.replaceChildren();
    content.append(element("div", "eyebrow", "RECORDED EVIDENCE"), element("h2", "", mode === "sources" ? "Source recording" : mode === "identity" ? "Verified identity" : mode === "record" || mode === "proof" ? "Observed effect" : mode === "tool" ? "Tool invocation" : mode === "input" ? "Caller ID assertion" : mode === "plan" ? "Recorded input" : "Session context"));
    const record = currentState.records.at(-1);
    const tool = currentState.toolCalls.at(-1);
    if (mode === "proof" || mode === "record") {
      if (!record) detail("Status", "No effect has been observed at this point in the recording.");
      else {
        detail("Evidence tier", tierNames[r.tier]);
        detail("Source timestamp", record.recordedAt);
        detail("Tool", record.tool);
        if (record.source === "backend") {
          detail("Finding", record.finding ?? "No rule violation recorded");
          detail("Verified caller at write", record.proof?.authBefore);
          detail("Target record", record.subject);
          detail("Before", record.before);
          detail("After", record.after);
        } else {
          detail("Artifact", record.artifact?.path);
          detail("SHA-256", record.artifact?.sha256);
          detail("Saved message", record.after);
          detail("Scope", "Tool arguments and file contents match. This smoke call does not establish a caller-ID policy bypass.");
        }
        detail("Evidence basis", record.proof?.explanation);
        detail("Tool arguments", record.proof?.args ?? tool?.args);
      }
    } else if (mode === "tool") {
      detail("Tool", tool?.tool);
      detail("Arguments", tool?.args);
      detail("Recorded result", tool?.proof);
    } else if (mode === "identity") {
      detail("Backend-authenticated identity", currentState.identity);
      detail("Auth state", currentState.auth);
    } else if (mode === "input") {
      detail("Observed caller ID", r.callerId);
      detail("Identity assurance", "Asserted input. Caller ID is not proof of account ownership.");
      detail("SIP context", r.rawEvents.find((e) => e.type === "caller.id")?.sip ?? r.rawEvents[0].sip);
    } else if (mode === "plan") {
      detail("Recorded plan", currentState.plan || "No model plan was recorded.");
      detail("DTMF events", r.events.filter((e) => e.at <= at && e.raw.type === "caller.dtmf").map((e) => e.proof));
    } else {
      detail("Run ID", r.id);
      detail("Recording type", r.sourceKind === "backend-probe" ? "Direct backend tool probe; no conversational model run" : r.transport);
      detail("Evidence tier", tierNames[r.tier]);
      detail("Version", r.version);
      detail("Original event span", `${(r.sourceDurationMs / 1e3).toFixed(3)} seconds. Playback uses presentation pacing; original timestamps are preserved.`);
      if (r.warnings.length) detail("Recording notes", r.warnings);
      detail("Source files and hashes", r.sources);
    }
    byId("drawer-shade").hidden = false;
    byId("evidence-drawer").hidden = false;
  }
  function closeDrawer() {
    drawerMode = null;
    byId("drawer-shade").hidden = true;
    byId("evidence-drawer").hidden = true;
  }
  function seek(next) {
    playing = false;
    at = Math.min(run().duration, Math.max(0, next));
    paint();
    if (drawerMode) openDrawer(drawerMode);
  }
  function toggle() {
    if (!playing && at >= run().duration) at = 0;
    playing = !playing;
    previousFrame = performance.now();
    paint();
  }
  root.addEventListener("click", (event) => {
    const target = event.target.closest("[data-action],[data-run],[data-node],[data-seek]");
    if (!target) return;
    if (target.dataset.run !== void 0) {
      selectRun(Number(target.dataset.run));
      return;
    }
    if (target.dataset.node) {
      playing = false;
      paint();
      openDrawer(target.dataset.node);
      return;
    }
    if (target.dataset.seek) {
      seek(Number(target.dataset.seek));
      return;
    }
    switch (target.dataset.action) {
      case "play":
        toggle();
        break;
      case "speed":
        speed = speed === 4 ? 1 : speed * 2;
        paint();
        break;
      case "reset":
        seek(0);
        break;
      case "close":
        closeDrawer();
        break;
      case "sources":
        playing = false;
        paint();
        openDrawer("sources");
        break;
      case "proof":
        playing = false;
        paint();
        openDrawer("proof");
        break;
    }
  });
  byId("drawer-shade").addEventListener("click", closeDrawer);
  byId("replay-position").addEventListener("input", (event) => seek(Number(event.target.value)));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeDrawer();
    const focus = document.activeElement;
    if ((event.key === "Enter" || event.key === " ") && focus?.hasAttribute("data-node")) {
      event.preventDefault();
      playing = false;
      paint();
      openDrawer(focus.dataset.node);
    } else if (event.code === "Space" && !["INPUT", "BUTTON", "SELECT", "TEXTAREA"].includes(focus?.tagName ?? "")) {
      event.preventDefault();
      toggle();
    }
  });
  function frame(now) {
    if (playing) {
      at = Math.min(run().duration, at + Math.max(0, now - previousFrame) / 1e3 * speed);
      if (at >= run().duration) playing = false;
      paint();
    }
    previousFrame = now;
    requestAnimationFrame(frame);
  }
  selectRun(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
